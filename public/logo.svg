<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a843;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c49b38;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8922f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a843;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c49b38;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="white" stroke="url(#goldGrad)" stroke-width="3"/>
  <!-- Crown/Shell ornament -->
  <g transform="translate(40, 20) scale(0.45)">
    <path d="M60,80 C40,80 20,60 25,40 C28,25 40,15 60,10 C80,5 100,15 110,30 C115,40 110,55 100,65 C90,75 75,80 60,80Z" 
          fill="url(#crownGrad)" stroke="#b8922f" stroke-width="2"/>
    <path d="M35,55 C40,45 50,38 65,35" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
    <circle cx="50" cy="45" r="3" fill="white" opacity="0.5"/>
    <circle cx="65" cy="38" r="3" fill="white" opacity="0.5"/>
    <circle cx="80" cy="40" r="3" fill="white" opacity="0.5"/>
    <circle cx="42" cy="55" r="2.5" fill="white" opacity="0.5"/>
    <circle cx="56" cy="52" r="2.5" fill="white" opacity="0.5"/>
    <circle cx="70" cy="50" r="2.5" fill="white" opacity="0.5"/>
  </g>
  <!-- Letter G -->
  <text x="100" y="145" font-family="Georgia, 'Times New Roman', serif" font-size="120" font-weight="bold" 
        fill="url(#goldGrad)" text-anchor="middle" dominant-baseline="middle"
        stroke="#b8922f" stroke-width="1">G</text>
</svg>
